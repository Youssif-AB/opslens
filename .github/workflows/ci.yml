name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check app benchmarks tests
      - run: python -m compileall -q app benchmarks tests
      - run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    needs: test
    env:
      OPSLENS_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        run: docker compose config
      - name: Start application
        run: docker compose up -d --build
      - name: Wait for readiness
        shell: bash
        run: |
          for i in {1..40}; do
            if curl --fail --silent http://localhost:8005/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs web worker
          exit 1
      - name: Check liveness
        run: curl --fail http://localhost:8005/health
      - name: Show container status
        run: docker compose ps
      - name: Clean up
        if: always()
        run: docker compose down -v
