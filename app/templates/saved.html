{% extends "layout.html" %}

{% block content %}
<h1 class="page-title">Saved Datasets</h1>

<div class="saved-layout">

  <div class="dataset-list">
    {% for d in datasets %}
      <div class="dataset-card">
        <div class="dataset-info">
          <div class="dataset-name">{{ d.filename }}</div>
          <div class="dataset-date">{{ d.uploaded_at }}</div>
        </div>

        <div class="dataset-actions">
          <a href="/open/{{ d.id }}" class="btn btn-open">Open</a>
          <a href="/delete/{{ d.id }}" class="btn btn-delete">Delete</a>
        </div>
      </div>
    {% endfor %}
  </div>

  <div class="upload-panel">
    <form method="POST" action="/saved/upload" enctype="multipart/form-data">
      <input type="file" name="file" required>
      <button type="submit" class="btn btn-upload">Upload dataset</button>
    </form>
  </div>

</div>


{% endblock %}
